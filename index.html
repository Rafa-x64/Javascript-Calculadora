<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora científica con soporte para raíz cuadrada, logaritmos, potencias, paréntesis y modo oscuro/claro.">
    <title>Calculadora Científica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Hoja de estilos (claro por defecto; el controller puede cambiarlo) -->
    <link rel="stylesheet" href="view/css/index_claro.css" id="style_sheet">

    <!-- Math.js — sin SRI para evitar bloqueos por hash incorrecto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.2.0/math.js"
        crossorigin="anonymous"></script>

    <!-- Bootstrap JS (Popper incluido en bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>

    <!-- Módulos JS propios -->
    <script type="module" src="controller/c_index.js"></script>
</head>

<body class="container-fluid">
    <main class="fila-calculadora row d-flex justify-content-center" style="padding: 20px;">
        <section class="borde-calculadora col-3" aria-label="Calculadora científica">

            <div class="opciones row d-flex flex-row text-right">
                <div
                    class="modo_oscuro"
                    id="modo_oscuro"
                    role="button"
                    tabindex="0"
                    title="Cambiar a modo oscuro"
                    aria-label="Cambiar a modo oscuro">
                </div>
            </div>

            <div class="pantalla d-flex flex-row" style="border-radius: 7px;">
                <input
                    type="text"
                    class="texto-calculadora text-end"
                    id="pantalla"
                    readonly
                    aria-label="Pantalla de la calculadora"
                    aria-live="polite">
            </div>

            <div class="teclado container" role="group" aria-label="Teclado de la calculadora">
                <div class="row d-flex flex-row justify-content-center">
                    <button id="btn-sqrt"              class="boton col-2 text-center"         value="sqrt"             aria-label="Raíz cuadrada">sqrt</button>
                    <button id="btn-lg"                class="boton col-2 text-center"         value="lg"               aria-label="Logaritmo base 10">lg</button>
                    <button id="btn-ln"                class="boton col-2 text-center"         value="ln"               aria-label="Logaritmo natural">ln</button>
                    <button id="btn-open-parenthesis"  class="boton col-2 text-center"         value="open_parenthesis" aria-label="Abrir paréntesis">(</button>
                    <button id="btn-close-parenthesis" class="boton col-2 text-center"         value="close_parenthesis" aria-label="Cerrar paréntesis">)</button>
                    <button id="btn-7"                 class="boton-numerico col-2 text-center" value="7">7</button>
                    <button id="btn-8"                 class="boton-numerico col-2 text-center" value="8">8</button>
                    <button id="btn-9"                 class="boton-numerico col-2 text-center" value="9">9</button>
                    <button id="btn-percent"           class="boton col-2 text-center"         value="percent"  aria-label="Porcentaje">%</button>
                    <button id="btn-power"             class="boton col-2 text-center"         value="power"    aria-label="Potencia">x^</button>
                    <button id="btn-4"                 class="boton-numerico col-2 text-center" value="4">4</button>
                    <button id="btn-5"                 class="boton-numerico col-2 text-center" value="5">5</button>
                    <button id="btn-6"                 class="boton-numerico col-2 text-center" value="6">6</button>
                    <button id="btn-divide"            class="boton col-2 text-center"         value="divide"   aria-label="División">/</button>
                    <button id="btn-multiply"          class="boton col-2 text-center"         value="multiply" aria-label="Multiplicación">x</button>
                    <button id="btn-1"                 class="boton-numerico col-2 text-center" value="1">1</button>
                    <button id="btn-2"                 class="boton-numerico col-2 text-center" value="2">2</button>
                    <button id="btn-3"                 class="boton-numerico col-2 text-center" value="3">3</button>
                    <button id="btn-subtract"          class="boton col-2 text-center"         value="subtract" aria-label="Resta">-</button>
                    <button id="btn-add"               class="boton col-2 text-center"         value="add"      aria-label="Suma">+</button>
                    <button id="btn-equals"            class="boton col-2 text-center"         value="equals"   aria-label="Igual">=</button>
                    <button id="btn-0"                 class="boton-numerico col-2 text-center" value="0">0</button>
                    <button id="btn-decimal"           class="boton col-2 text-center"         value="decimal"  aria-label="Decimal">.</button>
                    <button id="btn-delete"            class="boton col-2 text-center"         value="delete"   aria-label="Borrar último">del</button>
                    <button id="btn-ac"                class="boton col-2 text-center"         value="ac"       aria-label="Borrar todo">ac</button>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
