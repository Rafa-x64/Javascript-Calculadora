<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <!--hoja de estilos-->
    <link rel="stylesheet" href="view/css/index_claro.css" id="style_sheet">
    <!--cosas de js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.2.0/math.js"></script>
    <script type="module" src="model/calculadora.js"></script>
    <script type="module" src="controller/c_index.js"></script>
</head>

<body class="container-fluid">
    <div class="fila-calculadora row d-flex justify-content-center" style="padding: 20px;">
        <div class="borde-calculadora col-3">

            <div class="opciones row d-flex flex-row text-right">
                <div class="modo_oscuro" title="cambiar color" id="modo_oscuro">
                    <!--<img class="img-fluid" src="" alt="M_O">-->
                </div>
            </div>

            <div class="pantalla d-flex flex-row" style="border-radius: 7px;">
                <input type="text" class="texto-calculadora text-end" id="pantalla" readonly>
            </div>

            <div class="teclado container">
                <div class="row d-flex flex-row justify-content-center">
                    <button id="btn-sqrt" class="boton col-2 text-center" value="sqrt">sqrt</button>
                    <button id="btn-lg" class="boton col-2 text-center" value="lg">lg</button>
                    <button id="btn-ln" class="boton col-2 text-center" value="ln">ln</button>
                    <button id="btn-open-parenthesis" class="boton col-2 text-center"
                        value="open_parenthesis">(</button>
                    <button id="btn-close-parenthesis" class="boton col-2 text-center"
                        value="close_parenthesis">)</button>
                    <button id="btn-7" class="boton-numerico col-2 text-center" value="7">7</button>
                    <button id="btn-8" class="boton-numerico col-2 text-center" value="8">8</button>
                    <button id="btn-9" class="boton-numerico col-2 text-center" value="9">9</button>
                    <button id="btn-percent" class="boton col-2 text-center" value="percent">%</button>
                    <button id="btn-power" class="boton col-2 text-center" value="power">x^</button>
                    <button id="btn-4" class="boton-numerico col-2 text-center" value="4">4</button>
                    <button id="btn-5" class="boton-numerico col-2 text-center" value="5">5</button>
                    <button id="btn-6" class="boton-numerico col-2 text-center" value="6">6</button>
                    <button id="btn-divide" class="boton col-2 text-center" value="divide">/</button>
                    <button id="btn-multiply" class="boton col-2 text-center" value="multiply">x</button>
                    <button id="btn-1" class="boton-numerico col-2 text-center" value="1">1</button>
                    <button id="btn-2" class="boton-numerico col-2 text-center" value="2">2</button>
                    <button id="btn-3" class="boton-numerico col-2 text-center" value="3">3</button>
                    <button id="btn-subtract" class="boton col-2 text-center" value="subtract">-</button>
                    <button id="btn-add" class="boton col-2 text-center" value="add">+</button>
                    <button id="btn-equals" class="boton col-2 text-center" value="equals">=</button>
                    <button id="btn-0" class="boton-numerico col-2 text-center" value="0">0</button>
                    <button id="btn-decimal" class="boton col-2 text-center" value="decimal">.</button>
                    <button id="btn-delete" class="boton col-2 text-center" value="delete">del</button>
                    <button id="btn-ac" class="boton col-2 text-center" value="ac">ac</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
